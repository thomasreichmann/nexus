name: Post-Merge

on:
    push:
        branches: [main]
    workflow_dispatch:

concurrency:
    group: post-merge-main
    cancel-in-progress: false

jobs:
    # The long-lived `dev` branch backs the stable Vercel Preview deployment
    # that receives dev webhooks — CloudWatch alarms and Stripe
    # (infra/terraform/README.md, #127). Keep it pointing at main so that
    # deployment always runs production code.
    sync-dev-branch:
        name: Sync dev branch to main
        runs-on: ubuntu-latest
        timeout-minutes: 5
        # Dispatching this workflow from a non-main ref must not overwrite
        # dev — it backs a deployed webhook endpoint, not a scratch preview.
        if: github.ref == 'refs/heads/main'
        permissions:
            contents: write
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            # Force: dev is a mirror of main, never a place for real work —
            # anything stranded on it (e.g. a build-trigger commit) is
            # disposable by definition.
            - name: Push main to dev
              run: git push --force origin HEAD:refs/heads/dev

    migrate:
        name: Apply DB migrations (dev)
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node and pnpm
              uses: ./.github/actions/setup-node-pnpm

            - name: Apply migrations
              run: pnpm -F db db:migrate
              env:
                  DATABASE_URL: ${{ secrets.DATABASE_URL }}

    # Prod gates on the dev apply (same SQL against a schema-identical DB acts
    # as a canary) but deliberately NOT on smoke-tests: e2e can fail for
    # reasons unrelated to migrations (browsers, S3, Stripe), and gating prod
    # on it would leave prod drifted whenever e2e flakes.
    migrate-prod:
        name: Apply DB migrations (prod)
        needs: migrate
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node and pnpm
              uses: ./.github/actions/setup-node-pnpm

            - name: Verify DATABASE_URL_PROD secret is configured
              env:
                  DATABASE_URL: ${{ secrets.DATABASE_URL_PROD }}
              run: |
                  if [ -z "$DATABASE_URL" ]; then
                      echo "::error::secret DATABASE_URL_PROD is not configured (see docs/infra/supabase-manual-setup.md)"
                      exit 1
                  fi

            - name: Apply migrations
              run: pnpm -F db db:migrate
              env:
                  DATABASE_URL: ${{ secrets.DATABASE_URL_PROD }}

    # Ship the worker bundle on every merge so the Lambda code plane moves
    # with the schema plane (#417 follow-up: a column-dropping migration left
    # the old bundle emitting SELECTs for a dropped column until a human ran
    # update-function-code, ~7 minutes later on prod). Ordered after migrate
    # so additive migrations land before the code that reads them; destructive
    # migrations must ship alone — pr-check gates those behind the
    # migration:destructive label.
    deploy-worker:
        name: Deploy worker (dev)
        needs: migrate
        runs-on: ubuntu-latest
        timeout-minutes: 10
        env:
            AWS_ACCESS_KEY_ID: ${{ secrets.DEPLOY_AWS_ACCESS_KEY_ID }}
            AWS_SECRET_ACCESS_KEY: ${{ secrets.DEPLOY_AWS_SECRET_ACCESS_KEY }}
            AWS_REGION: us-east-1
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Verify deploy credentials are configured
              run: |
                  if [ -z "$AWS_ACCESS_KEY_ID" ]; then
                      echo "::error::secret DEPLOY_AWS_ACCESS_KEY_ID is not configured (see infra/terraform/README.md)"
                      exit 1
                  fi

            - name: Setup Node and pnpm
              uses: ./.github/actions/setup-node-pnpm

            - name: Build and deploy
              run: pnpm -F worker deploy:dev

    # Gates on the dev deploy (same bundle, so a broken build or bad zip fails
    # there first) and on the prod migration, mirroring migrate-prod's canary
    # ordering. Like migrate-prod, deliberately NOT gated on smoke-tests.
    deploy-worker-prod:
        name: Deploy worker (prod)
        needs: [migrate-prod, deploy-worker]
        runs-on: ubuntu-latest
        timeout-minutes: 10
        env:
            AWS_ACCESS_KEY_ID: ${{ secrets.DEPLOY_AWS_ACCESS_KEY_ID_PROD }}
            AWS_SECRET_ACCESS_KEY: ${{ secrets.DEPLOY_AWS_SECRET_ACCESS_KEY_PROD }}
            AWS_REGION: us-east-1
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Verify deploy credentials are configured
              run: |
                  if [ -z "$AWS_ACCESS_KEY_ID" ]; then
                      echo "::error::secret DEPLOY_AWS_ACCESS_KEY_ID_PROD is not configured (see infra/terraform/README.md)"
                      exit 1
                  fi

            - name: Setup Node and pnpm
              uses: ./.github/actions/setup-node-pnpm

            - name: Build and deploy
              run: pnpm -F worker deploy:prod

    smoke-tests:
        name: Smoke Tests
        needs: migrate
        runs-on: ubuntu-latest
        timeout-minutes: 15
        # e2e runs against a production build (next build + next start), so the
        # build step and the test step both need these at build/runtime.
        env:
            NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
            DATABASE_URL: ${{ secrets.DATABASE_URL }}
            AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
            AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
            AWS_REGION: ${{ secrets.AWS_REGION }}
            S3_BUCKET: ${{ secrets.S3_BUCKET }}
            SQS_QUEUE_URL: ${{ secrets.SQS_QUEUE_URL }}
            STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
            STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
            RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
            RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
            BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node and pnpm
              uses: ./.github/actions/setup-node-pnpm

            - name: Get Playwright version
              id: playwright-version
              run: echo "version=$(pnpm -F web exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

            - name: Cache Playwright browsers
              uses: actions/cache@v4
              with:
                  path: ~/.cache/ms-playwright
                  key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

            - name: Install Playwright OS dependencies
              timeout-minutes: 5
              run: pnpm -F web exec playwright install-deps chromium

            - name: Install Playwright browsers
              timeout-minutes: 5
              run: pnpm -F web exec playwright install chromium

            # Build the production bundle (and workspace deps, including
            # trpc-devtools) up front so a build failure fails fast here with
            # full logs. The Playwright webServer rebuilds via the same turbo
            # task, so this warms the cache and that rebuild is a no-op hit.
            - name: Build app and workspace packages
              run: pnpm exec turbo run build --filter=@nexus/web

            - name: Run smoke tests
              run: pnpm -F web test:e2e:smoke
