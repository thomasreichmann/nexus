name: Post-Merge

on:
    push:
        branches: [main]
    workflow_dispatch:

# Concurrency is per job, not per workflow (#556): each plane (dev branch,
# migrations, worker deploys) still runs one merge at a time, in merge order,
# but a merge's migrate-prod, which gates the web app's production promotion,
# waits only for the previous migrate-prod, not for the previous run's other
# jobs. (The e2e tiers live in post-merge-e2e.yml, which starts when this
# workflow completes, so a recovery re-run never waits on them.) GitHub keeps one queued entry per group and
# cancels the one a newer push replaces; a replaced migrate-prod ends
# cancelled, so that commit's deployment never promotes. Harmless when the newer
# commit has its own deployment, stuck when Vercel skipped building it
# (turbo-ignore, e.g. docs-only); Force Promote recovers. Per-job groups shrink
# that window from a whole run to one migrate-prod (~1 min).

jobs:
    # The long-lived `dev` branch backs the stable Vercel Preview deployment
    # that receives dev webhooks — CloudWatch alarms and Stripe
    # (infra/terraform/README.md, #127). Keep it pointing at main so that
    # deployment always runs production code.
    sync-dev-branch:
        name: Sync dev branch to main
        runs-on: ubuntu-latest
        timeout-minutes: 5
        concurrency:
            group: post-merge-sync-dev-branch
            cancel-in-progress: false
        # Dispatching this workflow from a non-main ref must not overwrite
        # dev — it backs a deployed webhook endpoint, not a scratch preview.
        if: github.ref == 'refs/heads/main'
        permissions:
            contents: write
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            # Force: dev is a mirror of main, never a place for real work —
            # anything stranded on it (e.g. a build-trigger commit) is
            # disposable by definition.
            - name: Push main to dev
              run: git push --force origin HEAD:refs/heads/dev

    migrate:
        name: Apply DB migrations (dev)
        runs-on: ubuntu-latest
        timeout-minutes: 10
        concurrency:
            group: post-merge-migrate
            cancel-in-progress: false
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node and pnpm
              uses: ./.github/actions/setup-node-pnpm

            - name: Apply migrations
              run: pnpm -F db db:migrate
              env:
                  DATABASE_URL: ${{ secrets.DATABASE_URL }}

    # Prod gates on the dev apply (same SQL against a schema-identical DB acts
    # as a canary) but deliberately NOT on e2e (post-merge-e2e.yml): e2e can fail for
    # reasons unrelated to migrations (browsers, S3, Stripe), and gating prod
    # on it would leave prod drifted whenever e2e flakes.
    #
    # This job also gates the web app's production promotion (#556): nexus-web
    # requires its check run, matched by the job name `Apply DB migrations
    # (prod)`, as a Vercel Deployment Check (apps/web/README.md → Deployment).
    # A main build is built but kept off the production domains until this job
    # succeeds on the same commit. Renaming the job silently drops the gate,
    # and no other workflow may reuse the name (same-named check runs collide).
    #
    # The job must never end as `skipped`: GitHub counts a skipped check as
    # passing, so a failed dev migration would promote code whose prod
    # migration never ran. Hence always() plus the first step, which turns
    # "dev didn't succeed" into a failure. always() also means a plain cancel
    # doesn't stop this job once it runs (GitHub keeps jobs whose `if` still
    # holds), and there is no per-job cancel. To stop it, force-cancel the run:
    # gh api -X POST repos/{owner}/{repo}/actions/runs/<run-id>/force-cancel
    #
    # Why the job and not a commit status: Vercel's check picker lists check
    # runs, and the status #567 posted from here never appeared in it. Vercel's
    # own status action is no way round that either: it reports the run's
    # first job's conclusion, not its own (vercel/repository-dispatch#15).
    migrate-prod:
        name: Apply DB migrations (prod)
        needs: migrate
        if: always()
        runs-on: ubuntu-latest
        timeout-minutes: 10
        concurrency:
            group: post-merge-migrate-prod
            cancel-in-progress: false
        steps:
            - name: Require the dev migration
              if: needs.migrate.result != 'success'
              env:
                  DEV_RESULT: ${{ needs.migrate.result }}
              run: |
                  echo "::error::dev migration $DEV_RESULT; prod migration not attempted"
                  exit 1

            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node and pnpm
              uses: ./.github/actions/setup-node-pnpm

            - name: Verify DATABASE_URL_PROD secret is configured
              env:
                  DATABASE_URL: ${{ secrets.DATABASE_URL_PROD }}
              run: |
                  if [ -z "$DATABASE_URL" ]; then
                      echo "::error::secret DATABASE_URL_PROD is not configured (see docs/infra/supabase-manual-setup.md)"
                      exit 1
                  fi

            - name: Apply migrations
              run: pnpm -F db db:migrate
              env:
                  DATABASE_URL: ${{ secrets.DATABASE_URL_PROD }}

    # A failed migration needs a person. Since #556 prod web keeps serving
    # the previous deployment instead of going live without its migration
    # (#550's outage). After a re-run lands the migration, the staged
    # deployment still needs a manual `vercel promote`: Vercel doesn't
    # re-evaluate it (tested on #569). A failed dev migration fails prod's too
    # (its first step).
    # Same raw-curl Discord rail as post-merge-e2e.yml; an unset secret
    # degrades to a no-op.
    notify-migration-failure:
        name: Notify Discord of a failed migration
        needs: [migrate, migrate-prod]
        if: failure()
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - name: Notify Discord
              env:
                  DISCORD_ALERT_WEBHOOK_URL: ${{ secrets.DISCORD_ALERT_WEBHOOK_URL }}
                  MESSAGE: >-
                      **Post-merge migration failed** on `${{ github.sha }}`:
                      dev ${{ needs.migrate.result }},
                      prod ${{ needs.migrate-prod.result }}.
                      Prod web stays on the previous deployment until the
                      migration lands; re-run the failed jobs, then
                      `vercel promote` the staged deployment —
                      <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}>.
                      If the log says lock timeout:
                      <${{ github.server_url }}/${{ github.repository }}/blob/main/docs/infra/prod-db-locks.md>
              run: |
                  if [ -z "$DISCORD_ALERT_WEBHOOK_URL" ]; then
                      echo "DISCORD_ALERT_WEBHOOK_URL not configured — skipping Discord notification."
                      exit 0
                  fi
                  jq -n --arg content "$MESSAGE" '{content: $content}' |
                      curl --silent --show-error --max-time 15 \
                          -H 'Content-Type: application/json' \
                          -d @- "$DISCORD_ALERT_WEBHOOK_URL"

    # Ship the worker bundle on every merge so the Lambda code plane moves
    # with the schema plane (#417 follow-up: a column-dropping migration left
    # the old bundle emitting SELECTs for a dropped column until a human ran
    # update-function-code, ~7 minutes later on prod). Ordered after migrate
    # so additive migrations land before the code that reads them; destructive
    # migrations must ship alone — pr-check gates those behind the
    # migration:destructive label.
    deploy-worker:
        name: Deploy worker (dev)
        needs: migrate
        runs-on: ubuntu-latest
        timeout-minutes: 10
        concurrency:
            group: post-merge-deploy-worker
            cancel-in-progress: false
        env:
            AWS_ACCESS_KEY_ID: ${{ secrets.DEPLOY_AWS_ACCESS_KEY_ID }}
            AWS_SECRET_ACCESS_KEY: ${{ secrets.DEPLOY_AWS_SECRET_ACCESS_KEY }}
            AWS_REGION: us-east-1
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Verify deploy credentials are configured
              run: |
                  if [ -z "$AWS_ACCESS_KEY_ID" ]; then
                      echo "::error::secret DEPLOY_AWS_ACCESS_KEY_ID is not configured (see infra/terraform/README.md)"
                      exit 1
                  fi

            - name: Setup Node and pnpm
              uses: ./.github/actions/setup-node-pnpm

            - name: Build and deploy
              run: pnpm -F worker deploy:dev

    # Gates on the dev deploy (same bundle, so a broken build or bad zip fails
    # there first) and on the prod migration, mirroring migrate-prod's canary
    # ordering. Like migrate-prod, deliberately NOT gated on e2e.
    deploy-worker-prod:
        name: Deploy worker (prod)
        needs: [migrate-prod, deploy-worker]
        runs-on: ubuntu-latest
        timeout-minutes: 10
        concurrency:
            group: post-merge-deploy-worker-prod
            cancel-in-progress: false
        env:
            AWS_ACCESS_KEY_ID: ${{ secrets.DEPLOY_AWS_ACCESS_KEY_ID_PROD }}
            AWS_SECRET_ACCESS_KEY: ${{ secrets.DEPLOY_AWS_SECRET_ACCESS_KEY_PROD }}
            AWS_REGION: us-east-1
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Verify deploy credentials are configured
              run: |
                  if [ -z "$AWS_ACCESS_KEY_ID" ]; then
                      echo "::error::secret DEPLOY_AWS_ACCESS_KEY_ID_PROD is not configured (see infra/terraform/README.md)"
                      exit 1
                  fi

            - name: Setup Node and pnpm
              uses: ./.github/actions/setup-node-pnpm

            - name: Build and deploy
              run: pnpm -F worker deploy:prod
