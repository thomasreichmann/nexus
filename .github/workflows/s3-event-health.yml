name: S3 Event Health

# Post-deploy watch for the S3 event pipeline (#285): tier drift, failed SNS
# webhooks, stuck retrievals. A failed run is the alert. Also posts a one-time
# success comment on PR #278 once the first real post-deploy event lands —
# that step is temporary (#286 tracks the generalized pattern).

on:
    schedule:
        - cron: '0 5 * * *'
    workflow_dispatch:

permissions:
    contents: read
    pull-requests: write

jobs:
    health:
        name: Drift + webhook/retrieval health (${{ matrix.env }})
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                include:
                    - env: dev
                      db-secret: DATABASE_URL
                      aws-key-id-secret: AWS_ACCESS_KEY_ID
                      aws-secret-key-secret: AWS_SECRET_ACCESS_KEY
                      bucket-secret: S3_BUCKET
                    - env: prod
                      db-secret: DATABASE_URL_PROD
                      aws-key-id-secret: AWS_ACCESS_KEY_ID_PROD
                      aws-secret-key-secret: AWS_SECRET_ACCESS_KEY_PROD
                      bucket-secret: S3_BUCKET_PROD
        # The DB and the bucket must come from the same environment or the
        # storage-tier check compares prod rows against the dev bucket and
        # reports every one as missing — which used to exit 0, so the prod leg
        # was permanently green while checking nothing (#318).
        #
        # AWS_REGION is genuinely shared (us-east-1 both). The rest below stays
        # dev-scoped and is inert: neither script reads Stripe, Resend, SQS or
        # auth, but @/lib/env validates the whole server schema at import, so
        # each var still has to be present and well-formed.
        env:
            DATABASE_URL: ${{ secrets[matrix.db-secret] }}
            AWS_ACCESS_KEY_ID: ${{ secrets[matrix.aws-key-id-secret] }}
            AWS_SECRET_ACCESS_KEY: ${{ secrets[matrix.aws-secret-key-secret] }}
            AWS_REGION: ${{ secrets.AWS_REGION }}
            S3_BUCKET: ${{ secrets[matrix.bucket-secret] }}
            SQS_QUEUE_URL: ${{ secrets.SQS_QUEUE_URL }}
            STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
            STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
            RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
            RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
            BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
            NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
            # Discord delivery for health-check findings (#288); unset secret
            # degrades to a no-op. VERCEL_ENV labels the alert's environment —
            # the same field Vercel sets at runtime.
            DISCORD_ALERT_WEBHOOK_URL: ${{ secrets.DISCORD_ALERT_WEBHOOK_URL }}
            VERCEL_ENV: ${{ matrix.env }}
        steps:
            # All four come from the job env above (matrixed secrets). An unset
            # one has to fail loudly here: empty AWS creds would otherwise send
            # the drift check off to compare against nothing.
            - name: Verify environment secrets are configured
              run: |
                  missing=()
                  [ -n "$DATABASE_URL" ] || missing+=("${{ matrix.db-secret }}")
                  [ -n "$AWS_ACCESS_KEY_ID" ] || missing+=("${{ matrix.aws-key-id-secret }}")
                  [ -n "$AWS_SECRET_ACCESS_KEY" ] || missing+=("${{ matrix.aws-secret-key-secret }}")
                  [ -n "$S3_BUCKET" ] || missing+=("${{ matrix.bucket-secret }}")
                  if [ ${#missing[@]} -gt 0 ]; then
                      echo "::error::secret(s) not configured for ${{ matrix.env }}: ${missing[*]} (see docs/infra/supabase-manual-setup.md)"
                      exit 1
                  fi

            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node and pnpm
              uses: ./.github/actions/setup-node-pnpm

            # The scripts load env via `tsx --env-file=.env.local`, which
            # errors if the file is missing; real values come from the job
            # env above (process env wins over the file).
            - name: Create empty env file
              run: touch apps/web/.env.local

            - name: Check storage-tier drift
              run: pnpm -F web backfill:storage-tier --check

            - name: Resolve PR 278 merge time
              if: matrix.env == 'dev'
              id: merge
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  echo "merged_at=$(gh pr view 278 --repo "$GITHUB_REPOSITORY" --json mergedAt -q '.mergedAt // empty')" >> "$GITHUB_OUTPUT"

            - name: Check webhook & retrieval health
              id: health
              run: |
                  set -o pipefail
                  ARGS=()
                  if [ -n "${{ steps.merge.outputs.merged_at }}" ]; then
                      ARGS=(--since "${{ steps.merge.outputs.merged_at }}")
                  fi
                  pnpm -F web check:s3-event-health "${ARGS[@]}" | tee health.log
                  echo "handled_since=$(sed -n 's/^handled_events_since=//p' health.log)" >> "$GITHUB_OUTPUT"

            # Temporary (#286 generalizes this): tick the post-deploy box on
            # PR #278 once the first real event has been processed end-to-end.
            # Remove this step after the comment lands.
            - name: Post one-time verification comment on PR 278
              if: matrix.env == 'dev' && steps.merge.outputs.merged_at != '' && steps.health.outputs.handled_since != '' && steps.health.outputs.handled_since != '0'
              env:
                  GH_TOKEN: ${{ github.token }}
                  HANDLED_SINCE: ${{ steps.health.outputs.handled_since }}
                  MERGED_AT: ${{ steps.merge.outputs.merged_at }}
              run: |
                  MARKER="<!-- post-deploy-verified-278 -->"
                  if gh pr view 278 --repo "$GITHUB_REPOSITORY" --json comments -q '.comments[].body' | grep -qF "$MARKER"; then
                      echo "Verification comment already posted — skipping."
                      exit 0
                  fi
                  cat > comment.md <<EOF
                  $MARKER
                  ✅ **Post-deploy verification passed** (automated by the s3-event-health workflow, #285)

                  - $HANDLED_SINCE handled-type S3 event(s) processed since merge ($MERGED_AT)
                  - \`backfill:storage-tier --check\`: no drift
                  - No failed SNS webhook events, no stuck retrievals

                  The remaining post-deploy test-plan item can be ticked.
                  EOF
                  gh pr comment 278 --repo "$GITHUB_REPOSITORY" --body-file comment.md
